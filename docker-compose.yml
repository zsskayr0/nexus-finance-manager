services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: nexus-server:latest
    container_name: nexus-server
    restart: unless-stopped
    ports:
      - "7023:7023"
    # Sem chave de API por padrão (ok pra uso em localhost/rede confiável) —
    # pra proteger antes de expor a porta pra fora da sua rede, descomente e
    # defina uma chave sua, e configure a MESMA chave no app (Configurações).
    # environment:
    #   NEXUS_API_KEY: "sua-chave-aqui"
    volumes:
      - nexus-data:/data

volumes:
  nexus-data:
