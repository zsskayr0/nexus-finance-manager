services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: nexus-server:latest
    container_name: nexus-server
    restart: unless-stopped
    ports:
      - "7023:7023"
    environment:
      # Troque por uma chave sua — sem isso o servidor sobe sem autenticação.
      NEXUS_API_KEY: "troque-esta-chave"
    volumes:
      - nexus-data:/data

volumes:
  nexus-data:
